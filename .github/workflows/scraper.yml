name: Scraper Sistema Maestro

on:
  schedule:
    # Ejecutar todos los días a las 8:00 AM (hora UTC). 
    # Puedes ajustar la hora en https://crontab.guru/
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña "Actions"

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Instalar Playwright y dependencias del sistema
        run: |
          playwright install --with-deps chromium

      - name: 🚀 Ejecutar Scraper
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          AREAS_BUSQUEDA: ${{ secrets.AREAS_BUSQUEDA }}
        run: |
          python main.py
