name: Scraper Sistema Maestro

on:
  schedule:
    # ⏰ 8:00 AM, 1:00 PM, 6:00 PM (Colombia) = 13, 18, 23 (UTC)
    - cron: '0 13,18,23 * * *'
    
  workflow_dispatch: # Permite ejecutarlo manualmente

# 👇 ESTO SOLUCIONA EL ERROR 403 DEL KEEP-ALIVE 👇
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Instalar Playwright y dependencias del sistema
        run: |
          playwright install --with-deps chromium

      - name: 🚀 Ejecutar Scraper
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          AREAS_BUSQUEDA: ${{ secrets.AREAS_BUSQUEDA }}
        run: |
          python main.py

      - name: 🔄 Keep-alive (Mantener repositorio activo)
        if: always()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git commit --allow-empty -m "Auto keep-alive"
          git push
