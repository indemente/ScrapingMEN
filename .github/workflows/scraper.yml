name: Scraper Sistema Maestro

on:
  schedule:
    # ⚠️ IMPORTANTE: GitHub usa hora UTC. 
    # Si estás en Colombia (UTC-5), debes sumar 5 horas.
    - cron: '0 13 * * *'  # Se ejecuta a las 8:00 AM (Hora Colombia)
    - cron: '0 18 * * *'  # Se ejecuta a la 1:00 PM (Hora Colombia)
    - cron: '0 23 * * *'  # Se ejecuta a las 6:00 PM (Hora Colombia)
    
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Instalar Playwright y dependencias del sistema
        run: |
          playwright install --with-deps chromium

      - name: 🚀 Ejecutar Scraper
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          AREAS_BUSQUEDA: ${{ secrets.AREAS_BUSQUEDA }}
        run: |
          python main.py

      - name: 🔄 Keep-alive (Mantener repositorio activo)
        if: always()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git commit --allow-empty -m "Auto keep-alive"
          git push
